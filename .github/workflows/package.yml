# WeFlow Windows 安装包打包校验（只打包 Windows，不发布）
#
# 与既有工作流的分工，避免重复触发：
#   - release.yml : push v* 标签时打包并发布到 GitHub Release（含 latest*.yml 注入、AUR 发布）
#   - ci.yml      : push / PR 的代码检查与 Windows vite 构建
#   - 本文件       : 手动或主干分支上验证 electron-builder 的 Windows NSIS 安装包能否正常生成，产物只从 Artifacts 下载
#
# 关键前置事实：
#   - Windows 打包目标由 package.json 的 build.win 决定：NSIS（.exe），并需要
#     resources/runtime/win32/*.dll（仓库已提交）与 public/icon.ico、installer.nsh。
#   - 用 npm ci --ignore-scripts --force 安装（参数取舍理由同 ci.yml），并显式传 --config.npmRebuild=false，
#     让 electron-builder 不再尝试用本机工具链重建 koffi / sherpa-onnx-node / sharp 等原生模块
#     （CI runner 没有完整 MSVC/Python 环境）。因此产物仅用于验证打包链路，不作为对外发布件。

name: Package (Windows smoke)

on:
  workflow_dispatch:
  push:
    # 只在主干分支验证打包（远端当前仅有 main），feature 分支请用 workflow_dispatch 手动触发
    branches: [main, master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  NPM_CI_FLAGS: "--ignore-scripts --force --no-audit --no-fund"
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows-x64:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci ${{ env.NPM_CI_FLAGS }}

      - name: Ensure build-time peer dependencies
        shell: bash
        run: |
          set -euo pipefail
          # @lobehub/icons 的 es/features/ProviderIcon/DefaultAvatar.js 会 import '@lobehub/ui'，
          # 而 @lobehub/ui 与 antd 在 package.json 里只是 @lobehub/icons 的 peerDependency。
          # 一旦安装环节丢弃它们，构建就会报 Rolldown failed to resolve import @lobehub/ui。
          # 这里做一次兜底：按 package-lock.json 记录的版本补装，仍缺失则直接失败并给出明确原因。
          for pkg in @lobehub/ui antd; do
            if [ ! -d "node_modules/$pkg" ]; then
              ver=$(node -p "const l=require('./package-lock.json').packages;((l['node_modules/'+process.argv[1]]||{}).version||'')" "$pkg")
              echo "::warning::installing missing peer dependency ${pkg}@${ver}"
              npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund "${pkg}@${ver}"
            fi
          done
          for pkg in @lobehub/ui antd; do
            [ -d "node_modules/$pkg" ] || { echo "::error::node_modules/$pkg is still missing"; exit 1; }
          done
          echo "build-time peer dependencies are present"

      - name: Clean previous bundle output
        run: node scripts/clean-dist-electron.cjs

      - name: Build renderer and electron bundles
        run: npx vite build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist-electron/main.js
          test -f dist-electron/preload.js

      - name: Package Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: weflow-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          retention-days: 7
          if-no-files-found: error
