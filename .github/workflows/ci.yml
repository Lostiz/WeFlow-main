# WeFlow CI —— 依赖安装 / 代码检查 / 单元测试 / Windows 生产构建
#
# 本文件的配置依据（均来自仓库实际内容，切勿凭空调整）：
#   1. 技术栈：Electron + Vite + React 19 + TypeScript。渲染层在 src/，主进程与各 Worker 在 electron/。
#   2. 包管理器：npm。仓库只提交了 package-lock.json，pnpm-lock.yaml 已被 .gitignore 忽略，因此统一用 npm ci。
#   3. Node 版本：24。与既有 workflow 一致；scripts/check-wcdb-optional-exports.cjs 也是以 node24 为目标编译。
#   4. 代码检查：仓库没有 ESLint / Prettier 配置，静态检查完全由 tsc 承担
#      （npm run typecheck:renderer -> tsconfig.json，npm run typecheck:electron -> tsconfig.node.json）。
#   5. 单元测试：npm run test:wcdb，用 node:test + esbuild 直接编译并驱动真实 TS 服务，
#      不加载任何原生库、不读取真实数据，因此可在 CI 中安全运行。
#   6. 安装依赖必须用 npm ci --ignore-scripts --force（见 env.NPM_CI_FLAGS 注释）。
#      绝不能改回 --legacy-peer-deps：Node 24 自带的 npm 11 会因此丢弃 lockfile 中的 peer 依赖，
#      构建必然报 "Rolldown failed to resolve import @lobehub/ui"。
#   7. 无需任何第三方可插拔组件（WCDB 动态库、解密插件、WeLive 可执行文件）即可完成全部检查与构建。

name: CI

on:
  # 本仓库远端实际只有 main 分支（.github/dependabot.yml 里写的 dev 尚不存在）。
  # 多列 master / dev 不会误触发，只是为分支重命名或后续新增 dev 分支留兼容；
  # 若确定只保留主干，把两处 branches 改成 [main] 即可。
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次运行，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  # 所有 npm 安装命令共用的参数：
  #   --ignore-scripts : 跳过 postinstall（patch-package / install-app-deps 原生重建 / 复制 Win DLL），
  #                      这些都需要本机编译工具链，且 patches/ 目录未入库
  #   --force          : 绕过 ansi-to-react 等包与 react 19 的 peer 冲突（不加则 npm ci 直接 ERESOLVE 失败），
  #                      同时保留 peer 依赖的安装——这正是 --legacy-peer-deps 在 npm 11 下做不到的
  NPM_CI_FLAGS: "--ignore-scripts --force --no-audit --no-fund"

jobs:
  # 任务一：代码检查 + 单元测试。先 install，再 renderer/electron 两次类型检查，最后跑 wcdb 契约测试。
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 项目同时支持 Windows / macOS / Linux，其中 Windows 有独立的路径与运行时分支，
        # 因此至少在 ubuntu 与 windows 两套环境中各验证一次（与 wcdb-compatibility.yml 保持一致）。
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci ${{ env.NPM_CI_FLAGS }}

      - name: Ensure build-time peer dependencies
        shell: bash
        run: |
          set -euo pipefail
          # @lobehub/icons 的 es/features/ProviderIcon/DefaultAvatar.js 会 import '@lobehub/ui'，
          # 而 @lobehub/ui 与 antd 在 package.json 里只是 @lobehub/icons 的 peerDependency。
          # 一旦安装环节丢弃它们，构建就会报 Rolldown failed to resolve import @lobehub/ui。
          # 这里做一次兜底：按 package-lock.json 记录的版本补装，仍缺失则直接失败并给出明确原因。
          for pkg in @lobehub/ui antd; do
            if [ ! -d "node_modules/$pkg" ]; then
              ver=$(node -p "const l=require('./package-lock.json').packages;((l['node_modules/'+process.argv[1]]||{}).version||'')" "$pkg")
              echo "::warning::installing missing peer dependency ${pkg}@${ver}"
              npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund "${pkg}@${ver}"
            fi
          done
          for pkg in @lobehub/ui antd; do
            [ -d "node_modules/$pkg" ] || { echo "::error::node_modules/$pkg is still missing"; exit 1; }
          done
          echo "build-time peer dependencies are present"

      - name: Typecheck renderer (src/**, tsconfig.json)
        run: npm run typecheck:renderer

      - name: Typecheck electron (electron/**, vite.config.ts, tsconfig.node.json)
        run: npm run typecheck:electron

      - name: Unit test - WCDB provider contract (node:test)
        run: npm run test:wcdb

  # 任务二：Windows 生产构建。依赖任务一通过后再执行，产出 dist/（渲染层）与 dist-electron/（主进程与 Worker）。
  # 这里只跑 vite build，不做 electron-builder 打包；Windows 安装包由 package.yml 负责。
  build:
    name: Build (windows)
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci ${{ env.NPM_CI_FLAGS }}

      - name: Ensure build-time peer dependencies
        shell: bash
        run: |
          set -euo pipefail
          for pkg in @lobehub/ui antd; do
            if [ ! -d "node_modules/$pkg" ]; then
              ver=$(node -p "const l=require('./package-lock.json').packages;((l['node_modules/'+process.argv[1]]||{}).version||'')" "$pkg")
              echo "::warning::installing missing peer dependency ${pkg}@${ver}"
              npm install --no-save --ignore-scripts --legacy-peer-deps --no-audit --no-fund "${pkg}@${ver}"
            fi
          done
          for pkg in @lobehub/ui antd; do
            [ -d "node_modules/$pkg" ] || { echo "::error::node_modules/$pkg is still missing"; exit 1; }
          done
          echo "build-time peer dependencies are present"

      - name: Clean previous bundle output
        run: node scripts/clean-dist-electron.cjs

      - name: Build renderer and electron bundles
        run: npx vite build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          # package.json 的 main 指向 dist-electron/main.js，渲染层入口是 dist/index.html
          test -f dist/index.html
          test -f dist-electron/main.js
          test -f dist-electron/preload.js

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: weflow-build-windows
          path: |
            dist
            dist-electron
          retention-days: 7
          if-no-files-found: error
